name: Build and test dotfiles

on:
  push:
    branches:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    name: "Build and test"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup docker buildkit
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: test
          load: true
          context: .
          target: build
      - name: Test
        run: |
          docker run --rm -t test

  macos:
    runs-on: macos-latest
    name: "macOS install"
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Mac profile and shared setup
        shell: bash
        env:
          NONINTERACTIVE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          # Avoid conflicts with the runner's existing dotfiles.
          export HOME="$RUNNER_TEMP/dotfiles-home"
          mkdir -p "$HOME"
          eval "$(brew shellenv)"
          ./install -x -vv -c install.macos.conf.yaml --plugin-dir modules/dotbot-brew
          # TPM discards Git's stderr; stream Git's separate, redacted trace.
          trace="$RUNNER_TEMP/dotfiles-git-trace.log"
          touch "$trace"
          tail -n +1 -f "$trace" &
          trace_pid=$!
          trap 'kill "$trace_pid" 2>/dev/null || true' EXIT
          GIT_TRACE="$trace" GIT_TRACE_CURL="$trace" \
            GIT_TRACE_CURL_NO_DATA=1 GIT_TRACE_REDACT=1 \
            GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=60 \
            ./install -x -vv
