name: Build and test dotfiles

on:
  push:
    branches:
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    name: "Build and test"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup docker buildkit
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: test
          load: true
          context: .
          target: build
      - name: Test
        run: |
          docker run --rm -t test

  macos:
    runs-on: macos-latest
    name: "macOS install"
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Mac profile and shared setup
        shell: bash
        env:
          NONINTERACTIVE: "1"
          PYTHONUNBUFFERED: "1"
          # Public clones must not try to save TPM's dummy credentials to Keychain.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ""
        run: |
          # Avoid conflicts with the runner's existing dotfiles.
          export HOME="$RUNNER_TEMP/dotfiles-home"
          mkdir -p "$HOME"
          eval "$(brew shellenv)"
          ./install -x -vv -c install.macos.conf.yaml --plugin-dir modules/dotbot-brew
          ./install -x -vv
